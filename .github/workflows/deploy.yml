name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Makefile'
      - 'deploy/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ADMIN_USER,ADMIN_PASS
          script: |
            set -euo pipefail
            export PATH=$PATH:/usr/local/node/bin

            cd ~/tech-blog
            git pull origin main

            # Write .env from secrets. The database is SQLite in ~/blog-data,
            # mounted into the container (deploy/docker-compose.yml).
            printf '%s\n' \
              "PORT=8081" \
              "ALLOWED_ORIGINS=https://blog.alejandrogmota.com" \
              "DB_TYPE=sqlite" \
              "ADMIN_USER=${ADMIN_USER}" \
              "ADMIN_PASS=${ADMIN_PASS}" \
              > .env

            # Build frontend and admin; the container mounts both dist dirs.
            cd frontend
            npm ci
            npx vite build
            npx vite build --config vite.admin.config.js
            mv ../backend/admin-dist/admin.html ../backend/admin-dist/index.html

            # Build and restart the API container.
            cd ~/tech-blog
            docker compose -f deploy/docker-compose.yml up -d --build

            for i in $(seq 1 20); do
              curl -sf http://127.0.0.1:8081/api/health > /dev/null && echo healthy && exit 0
              sleep 2
            done
            docker logs --tail 50 tech-blog
            exit 1
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
